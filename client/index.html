<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>TurnosRed - Tiempo real</title>
  </head>
  <body>
    <h1>Eventos en tiempo real</h1>

    <ul id="eventos"></ul>

    <script src="http://localhost:3000/socket.io/socket.io.js"></script>

    <script>
      const socket = io('http://localhost:3000');

      const lista = document.getElementById('eventos');

      function mostrarEvento(nombre, turno) {
        const item = document.createElement('li');

        item.textContent =
          nombre + ' - ID: ' + turno.id + ' - Paciente: ' + turno.paciente;

        lista.appendChild(item);
      }

      socket.on('connect', () => {
        console.log('Conectado a Socket.IO');
      });

      socket.on('turno:nuevo', (turno) => {
        mostrarEvento('Turno nuevo', turno);
      });

      socket.on('turno:actualizado', (turno) => {
        mostrarEvento('Turno actualizado', turno);
      });

      socket.on('turno:eliminado', (turno) => {
        mostrarEvento('Turno eliminado', turno);
      });
    </script>
  </body>
</html>
